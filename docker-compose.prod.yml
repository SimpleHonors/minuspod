services:
  minuspod:
    networks:
      production_net:
        ipv4_address: ${MINUSPOD_IP:-192.168.1.100}
    ports:
      - "${MINUSPOD_PORT:-8080}:${MINUSPOD_PORT:-8080}"
    environment:
      - MINUSPOD_PORT=${MINUSPOD_PORT:-8080}

networks:
  production_net:
    name: ${MINUSPOD_NETWORK:-production_net}
    external: true
